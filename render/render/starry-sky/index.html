<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星空与流星 · Render Demo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02040f; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<script>
(function () {
  'use strict';
  const TEXT_A = '愿你的未来，';
  const TEXT_B = '如星空般璀璨闪耀。';
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  const off = document.createElement('canvas');
  const offCtx = off.getContext('2d', { willReadFrequently: true });
  let W = 0, H = 0, dpr = 1;
  let stars = [], meteors = [], textParticles = [];
  let textChars = [];   // 每字的清晰层：{ char, x, y, delay, fontSize }
  let lastTime = 0, nextMeteorAt = 0;
  let gatherStart = 0, textReady = false;

  const CFG = {
    starDensity: 0.00018,      // 每像素星星数
    maxStars: 420,
    meteorMinGap: 900,         // 流星最小间隔 ms
    meteorMaxGap: 3200,
    meteorSpeed: 0.55,         // px/ms
    trailLength: 180,
    textSampleStep: 2,         // 文字采样步长（像素），越小点越密越清晰
    textMaxParticles: 2400,
    textCharGap: 300,          // 相邻字的出场间隔 ms（约为汇聚时长的 1/3，形成重叠）
    textDuration: 900,         // 单字汇聚时长 ms
  };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    initStars();
    buildTextParticles();
  }

  function initStars() {
    const count = Math.min(CFG.maxStars, Math.floor(W * H * CFG.starDensity));
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.2 + 0.3,
      base: Math.random() * 0.5 + 0.35,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.002 + 0.0008,
      tint: Math.random() < 0.6 ? '125,211,252' : '255,255,255',
    }));
  }

  function buildTextParticles() {
    const cols = [Array.from(TEXT_A), Array.from(TEXT_B)];
    const fontSize = Math.max(14, Math.min(46, H * 0.068, (W - 60) / 2.8));
    const lineStep = fontSize * 1.28;
    const columnGap = fontSize * 1.7;
    // 整体中心落在屏幕右侧约 3/4 处，避免贴边
    const centerX = W * 0.76;
    const rightX = centerX + columnGap / 2;
    const leftX = centerX - columnGap / 2;
    const colX = [rightX, leftX];

    off.width = Math.ceil(fontSize * 1.6);
    off.height = off.width;
    offCtx.font = 'bold ' + fontSize + 'px "Microsoft YaHei","PingFang SC",sans-serif';
    offCtx.textAlign = 'center';
    offCtx.textBaseline = 'middle';
    offCtx.fillStyle = '#fff';

    const step = CFG.textSampleStep;
    const half = off.width / 2;
    const next = [];
    const charMeta = [];
    let charIndex = 0;

    // 阅读顺序：右列从上到下，再左列从上到下，逐字出场
    for (let c = 0; c < cols.length; c++) {
      const line = cols[c];
      // 以最长列统一基准居中，右列再上移半个行距，使其顶部高于左列
      const baseY = H / 2 - (Math.max(cols[0].length, cols[1].length) - 1) * lineStep / 2;
      const startY = baseY - (c === 0 ? lineStep * 0.5 : 0);
      for (let i = 0; i < line.length; i++) {
        offCtx.clearRect(0, 0, off.width, off.height);
        offCtx.fillText(line[i], half, half);
        const data = offCtx.getImageData(0, 0, off.width, off.height).data;
        const tx = colX[c], ty = startY + i * lineStep;
        const delay = charIndex * CFG.textCharGap;
        charMeta.push({ char: line[i], x: tx, y: ty, delay, fontSize });
        charIndex++;

        for (let y = 0; y < off.height; y += step) {
          for (let x = 0; x < off.width; x += step) {
            const a = data[(y * off.width + x) * 4 + 3];
            if (a > 120) {
              next.push({
                sx: Math.random() * W, sy: Math.random() * H,
                tx: tx + x - half, ty: ty + y - half,
                delay,
                phase: Math.random() * Math.PI * 2,
                r: Math.random() * 0.5 + 0.95,
                blue: Math.random() < 0.8,
              });
            }
          }
        }
      }
    }

    if (next.length > CFG.textMaxParticles) {
      const skip = Math.ceil(next.length / CFG.textMaxParticles);
      textParticles = next.filter((_, i) => i % skip === 0);
    } else {
      textParticles = next;
    }
    textChars = charMeta;
    gatherStart = performance.now();
    textReady = false;
  }

  function spawnMeteor() {
    const dir = Math.random() < 0.5 ? 1 : -1;
    const speed = CFG.meteorSpeed * (0.8 + Math.random() * 0.5);
    const margin = 60;
    let x, y;
    if (dir === 1) { x = Math.random() * W * 0.75; y = -margin; }
    else { x = W + margin; y = Math.random() * H * 0.45; }
    meteors.push({
      x, y, speed,
      vx: Math.cos(Math.PI / 4) * speed * dir,
      vy: Math.sin(Math.PI / 4) * speed,
      life: 0,
      len: CFG.trailLength * (0.7 + Math.random() * 0.6),
      width: Math.random() * 1.2 + 1.1,
    });
  }

  function scheduleMeteor(now) {
    nextMeteorAt = now + CFG.meteorMinGap +
      Math.random() * (CFG.meteorMaxGap - CFG.meteorMinGap);
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#04081c');
    g.addColorStop(0.55, '#02040f');
    g.addColorStop(1, '#01020a');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const neb = ctx.createRadialGradient(
      W * 0.72, H * 0.28, 0, W * 0.72, H * 0.28, Math.max(W, H) * 0.55
    );
    neb.addColorStop(0, 'rgba(60,80,180,0.10)');
    neb.addColorStop(0.5, 'rgba(30,40,110,0.04)');
    neb.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = neb;
    ctx.fillRect(0, 0, W, H);
  }

  function drawStars(t) {
    for (const s of stars) {
      const tw = s.base + Math.sin(t * s.speed + s.phase) * 0.28;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(' + s.tint + ',' + Math.max(0.05, tw) + ')';
      ctx.fill();
    }
  }

  function drawTextParticles(now) {
    if (!textParticles.length) return;
    const elapsed = now - gatherStart;
    for (const p of textParticles) {
      let k = 1;
      if (!textReady) {
        k = Math.max(0, Math.min(1, (elapsed - p.delay) / CFG.textDuration));
        k = 1 - Math.pow(1 - k, 3);
      }
      if (k <= 0) continue;
      const x = p.sx + (p.tx - p.sx) * k;
      const y = p.sy + (p.ty - p.sy) * k;
      const alpha = k < 1
        ? k
        : 0.9 + 0.1 * Math.sin(now * 0.0015 + p.phase);
      ctx.beginPath();
      ctx.arc(x, y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.blue
        ? 'rgba(125,211,252,' + alpha + ')'
        : 'rgba(255,255,255,' + alpha + ')';
      ctx.fill();
    }

    // 每字汇聚完成后叠加清晰实体字，保证可读性；粒子保留微闪作点缀
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const cm of textChars) {
      if (elapsed < cm.delay + CFG.textDuration) continue;
      ctx.font = 'bold ' + cm.fontSize + 'px "Microsoft YaHei","PingFang SC",sans-serif';
      ctx.fillStyle = 'rgba(168,224,255,0.92)';
      ctx.fillText(cm.char, cm.x, cm.y);
    }

    const lastDelay = (Array.from(TEXT_A).length + Array.from(TEXT_B).length - 1) * CFG.textCharGap;
    if (!textReady && elapsed > lastDelay + CFG.textDuration) textReady = true;
  }

  function drawMeteors(dt) {
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      m.life += dt;

      const nx = m.vx / m.speed, ny = m.vy / m.speed;
      const tx = m.x - nx * m.len, ty = m.y - ny * m.len;

      const grad = ctx.createLinearGradient(tx, ty, m.x, m.y);
      grad.addColorStop(0, 'rgba(255,255,255,0)');
      grad.addColorStop(0.75, 'rgba(180,205,255,0.35)');
      grad.addColorStop(1, 'rgba(255,255,255,0.95)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = m.width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(m.x, m.y);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(m.x, m.y, m.width * 1.6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fill();

      if (m.x < -300 || m.x > W + 300 || m.y > H + 300 || m.life > 4000) {
        meteors.splice(i, 1);
      }
    }
  }

  function frame(now) {
    const dt = Math.min(now - lastTime, 50);
    lastTime = now;
    drawBackground();
    drawStars(now);
    drawTextParticles(now);
    if (now >= nextMeteorAt) { spawnMeteor(); scheduleMeteor(now); }
    drawMeteors(dt);
    requestAnimationFrame(frame);
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 150);
  });
  resize();
  nextMeteorAt = performance.now() + 600;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
