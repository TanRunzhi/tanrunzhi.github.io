<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面渲染 · 动效展示</title>
<style>
  :root{
    --brand:#2563eb;
    --brand-2:#38bdf8;
    --bg:#f5f7fb;
    --card:#ffffff;
    --line:#e5e9f2;
    --txt:#1e293b;
    --sub:#64748b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--txt);
    background:
      radial-gradient(1000px 600px at 10% -10%, rgba(59,130,246,.14) 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(56,189,248,.12) 0%, transparent 55%),
      var(--bg);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 20px;
  }
  .wrap{
    width:min(1040px,100%);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    padding:36px 32px;
    box-shadow:
      0 1px 2px rgba(15,23,42,.04),
      0 24px 60px -24px rgba(15,23,42,.18);
    animation:rise .6s ease both;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(18px)}
    to{opacity:1;transform:none}
  }
  .top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .home-link{
    display:inline-flex;align-items:center;gap:6px;
    font-size:13px;text-decoration:none;color:var(--brand);
    border:1px solid rgba(37,99,235,.25);background:rgba(37,99,235,.06);
    padding:7px 14px;border-radius:999px;transition:.2s;
  }
  .home-link:hover{background:rgba(37,99,235,.12)}
  .tag{
    display:inline-block;
    font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:#2563eb;border:1px solid rgba(37,99,235,.25);
    background:rgba(37,99,235,.07);padding:5px 12px;border-radius:999px;margin-top:18px;
  }
  h1{
    margin-top:12px;
    font-size:clamp(24px,5vw,34px);line-height:1.2;
    background:linear-gradient(92deg,#0f172a 0%,var(--brand) 65%,var(--brand-2) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;word-break:break-word;
  }
  p.desc{margin-top:10px;color:var(--sub);line-height:1.8;font-size:15px}
  .search{margin-top:24px;position:relative}
  .search input{
    width:100%;font:inherit;font-size:15px;padding:13px 18px 13px 44px;
    border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--txt);
    box-shadow:0 1px 2px rgba(15,23,42,.04);outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .search input:focus{border-color:rgba(37,99,235,.5);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
  .search::before{
    content:"🔍";position:absolute;left:16px;top:50%;transform:translateY(-50%);
    font-size:16px;opacity:.6;
  }
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:18px;margin-top:26px;
  }
  .card{
    display:flex;flex-direction:column;overflow:hidden;
    border:1px solid var(--line);border-radius:16px;background:#fff;
    box-shadow:0 1px 2px rgba(15,23,42,.05);
    transition:transform .2s, box-shadow .2s, border-color .2s;
  }
  .card:hover{
    transform:translateY(-3px);
    border-color:rgba(37,99,235,.35);
    box-shadow:0 16px 32px -16px rgba(37,99,235,.4);
  }
  .preview-wrap{
    display:block;position:relative;aspect-ratio:16/9;overflow:hidden;background:#02040f;
  }
  .preview-wrap img{
    width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .35s;
  }
  .card:hover .preview-wrap img{transform:scale(1.04)}
  .play-badge{
    position:absolute;right:12px;bottom:12px;
    font-size:12px;color:#fff;background:rgba(15,23,42,.55);
    border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 11px;
    backdrop-filter:blur(4px);
  }
  .card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
  .card-title{font-size:16px;font-weight:600}
  .card-desc{font-size:13px;line-height:1.65;color:var(--sub);flex:1}
  .card-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
  .open-btn{
    display:inline-flex;align-items:center;gap:6px;
    font:inherit;font-size:13px;font-weight:600;text-decoration:none;
    color:#1d4ed8;border:1px solid rgba(37,99,235,.3);
    background:linear-gradient(92deg,#e8f1ff,#e0f7ff);
    border-radius:10px;padding:8px 14px;transition:.2s;
  }
  .open-btn:hover{background:linear-gradient(92deg,#dbeaff,#d2f3ff)}
  .kw{font-size:12px;color:#94a3b8}
  .empty{
    grid-column:1/-1;color:var(--sub);font-size:14px;
    text-align:center;padding:32px 0;
  }
  footer{margin-top:30px;font-size:12px;color:#94a3b8;text-align:center}
</style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <span class="home-link" aria-hidden="true">🌌 Render Gallery</span>
      <a class="home-link" href="../index.html">← 返回首页</a>
    </div>
    <span class="tag">Render · 页面渲染</span>
    <h1>HTML 页面渲染</h1>
    <p class="desc">
      这里收录了已完成的 HTML 动效页面。下方为静态预览图，点击「新窗口查看」即可打开完整动效。
    </p>

    <div class="search">
      <input id="search" type="search" placeholder="搜索渲染页面，如 星空、流星…" autocomplete="off">
    </div>

    <nav class="grid" id="grid"></nav>
    <footer>tanrunzhi.github.io · 页面渲染</footer>
  </main>

<script>
  // 新增渲染页时，往 PAGES 里加一项即可（预览图建议放同目录下的 preview.png）。
  const PAGES = [
    {
      name:'星空与流星',
      desc:'深空渐变背景上的星海，星星随机闪烁，流星每隔数秒划过夜空，带渐变拖尾与光点。',
      href:'render/starry-sky/index.html',
      preview:'render/starry-sky/preview.png',
      kw:'星空 星星 流星 动效 canvas star meteor night'
    }
  ];

  const grid = document.getElementById('grid');
  const searchInput = document.getElementById('search');

  function makeCard(p){
    const card = document.createElement('article');
    card.className = 'card';

    const preview = document.createElement('a');
    preview.className = 'preview-wrap';
    preview.href = p.href;
    preview.target = '_blank';
    preview.rel = 'noopener';
    preview.title = '新窗口查看：' + p.name;
    preview.innerHTML =
      '<img src="' + p.preview + '" alt="' + p.name + ' 预览">' +
      '<span class="play-badge">▶ 点击查看动效</span>';

    const body = document.createElement('div');
    body.className = 'card-body';
    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = p.name;
    const desc = document.createElement('div');
    desc.className = 'card-desc';
    desc.textContent = p.desc;
    const foot = document.createElement('div');
    foot.className = 'card-foot';
    const open = document.createElement('a');
    open.className = 'open-btn';
    open.href = p.href;
    open.target = '_blank';
    open.rel = 'noopener';
    open.textContent = '↗ 新窗口查看';
    const kw = document.createElement('span');
    kw.className = 'kw';
    kw.textContent = 'HTML / Canvas';
    foot.appendChild(open);
    foot.appendChild(kw);

    body.appendChild(title);
    body.appendChild(desc);
    body.appendChild(foot);
    card.appendChild(preview);
    card.appendChild(body);
    return card;
  }

  function render(q){
    q = (q || '').trim().toLowerCase();
    const list = q
      ? PAGES.filter(p => (p.name + ' ' + p.desc + ' ' + (p.kw || '')).toLowerCase().includes(q))
      : PAGES;
    grid.innerHTML = '';
    if(!list.length){
      grid.innerHTML = '<p class="empty">未找到匹配的页面，换个关键词试试～</p>';
      return;
    }
    list.forEach(p => grid.appendChild(makeCard(p)));
  }

  searchInput.addEventListener('input', e => render(e.target.value));
  render();
</script>
</body>
</html>
