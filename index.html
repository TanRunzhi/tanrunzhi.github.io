<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主页 · 路由导航</title>
<style>
  :root{
    --brand:#2563eb;
    --brand-2:#38bdf8;
    --bg:#f5f7fb;
    --card:#ffffff;
    --line:#e5e9f2;
    --txt:#1e293b;
    --sub:#64748b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    color:var(--txt);
    background:
      radial-gradient(1000px 600px at 10% -10%, rgba(59,130,246,.14) 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(56,189,248,.12) 0%, transparent 55%),
      var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .wrap{
    width:min(880px,100%);
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    padding:40px 36px;
    box-shadow:
      0 1px 2px rgba(15,23,42,.04),
      0 24px 60px -24px rgba(15,23,42,.18);
    animation:rise .6s ease both;
  }
  @keyframes rise{
    from{opacity:0;transform:translateY(18px)}
    to{opacity:1;transform:none}
  }
  .tag{
    display:inline-block;
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#2563eb;
    border:1px solid rgba(37,99,235,.25);
    background:rgba(37,99,235,.07);
    padding:5px 12px;
    border-radius:999px;
    margin-bottom:18px;
  }
  h1{
    font-size:clamp(26px,5vw,38px);
    line-height:1.2;
    background:linear-gradient(92deg,#0f172a 0%,var(--brand) 65%,var(--brand-2) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    word-break:break-word;
  }
  p.desc{
    margin-top:12px;
    color:var(--sub);
    line-height:1.8;
    font-size:15px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:14px;
    margin-top:28px;
  }
  a.btn{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:6px;
    text-decoration:none;
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px;
    background:#fff;
    color:var(--txt);
    box-shadow:0 1px 2px rgba(15,23,42,.05);
    transition:transform .2s, box-shadow .2s, border-color .2s;
  }
  a.btn:hover{
    transform:translateY(-2px);
    border-color:rgba(37,99,235,.35);
    box-shadow:0 12px 28px -12px rgba(37,99,235,.35);
  }
  a.btn .ico{font-size:22px;line-height:1}
  a.btn .name{font-size:15px;font-weight:600}
  a.btn .hint{font-size:12px;color:var(--sub)}
  a.btn.primary{
    border-color:rgba(37,99,235,.3);
    background:linear-gradient(92deg,#e8f1ff,#e0f7ff);
    color:#1d4ed8;
    box-shadow:0 8px 20px -12px rgba(37,99,235,.4);
  }
  a.btn.primary .hint{color:#3b6fd4}
  a.btn.primary:hover{
    background:linear-gradient(92deg,#dbeaff,#d2f3ff);
    box-shadow:0 14px 28px -12px rgba(37,99,235,.5);
  }
  footer{
    margin-top:28px;
    font-size:12px;
    color:#94a3b8;
    text-align:center;
  }
</style>
</head>
<body>
  <main class="wrap">
    <span class="tag">Home · 路由导航</span>
    <h1>主页 / 功能入口</h1>
    <p class="desc">
      这是项目的主路由页，集成了各个功能模块的入口。点击下方按钮即可跳转到对应页面。
    </p>

    <nav class="grid">
      <a class="btn primary" href="demo/demo.html">
        <span class="ico">🧪</span>
        <span class="name">demo测试</span>
        <span class="hint">腾讯edge测试演示页</span>
      </a>
    </nav>

    <footer>tanrunzhi.github.io · 主页路由导航</footer>
  </main>
</body>
</html>
